# Hyblis vault spike. Self-contained: ffi off, no fs, no network.
# forge-std is reused from the prepared cap task bundle so tests run offline.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
ffi = false
fs_permissions = []
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
